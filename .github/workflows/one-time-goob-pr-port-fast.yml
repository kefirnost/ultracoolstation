name: One-time Goob PR port (shallow)
on:
  push:
    branches:
      - codex/port-goob-bootstrap-fast
permissions:
  contents: write
  pull-requests: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target base
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch only the requested source commits
        shell: bash
        run: |
          set -euo pipefail
          git remote add goob https://github.com/Goob-Station/Goob-Station.git
          git config remote.goob.promisor true
          git config remote.goob.partialclonefilter blob:none
          git fetch --filter=blob:none --depth=2 --no-tags goob \
            e539d4a5b2995ebc9c373769c4ae4754203efc75 \
            8594298dd281d09c9b1414a231fc1564f9b68156 \
            7690aec58157a1de1260e61fdb9d6220777bdd86 \
            2ed7a5de7e07f318aea8faffe5ef8a1b3e1c912f \
            64bc12d57222fc6ed6626e65554f738639de66e5
      - name: Cherry-pick the requested changes
        shell: bash
        run: |
          set -euo pipefail
          git switch -c codex/port-goob-bootstrap-fast
          for commit in \
            e539d4a5b2995ebc9c373769c4ae4754203efc75 \
            8594298dd281d09c9b1414a231fc1564f9b68156 \
            7690aec58157a1de1260e61fdb9d6220777bdd86 \
            2ed7a5de7e07f318aea8faffe5ef8a1b3e1c912f \
            64bc12d57222fc6ed6626e65554f738639de66e5; do
            echo "Cherry-picking $commit"
            git cherry-pick -X theirs "$commit"
          done
          git log --oneline -5
      - name: Push ported branch
        run: git push --force origin HEAD:refs/heads/codex/port-goob-bootstrap-fast
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Port Goob PRs #7396, #7422, #7432, #7455 and #7463"
          existing="$(gh pr list --repo "${{ github.repository }}" --base master --state open --json title --jq "map(select(.title == \"$title\")) | length")"
          if [ "$existing" = "0" ]; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --base master \
              --head codex/port-goob-bootstrap-fast \
              --title "$title" \
              --body "Ports the five requested Goob Station changes in merge order: #7396 (ports and Runechat), #7422 (jiggle/slime/emotes), #7432 (port revisions and fixes), #7455 (new lobby UI, news and voice UI), and #7463 (lobby UI follow-up). Cherry-picked onto the current OmuStation-based master with the 'theirs' conflict preference for overlapping hunks. Please review the diff and run the project CI before merging."
          else
            echo "An equivalent port PR is already open; skipping duplicate PR creation."
          fi
